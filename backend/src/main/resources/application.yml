spring:
  application:
    name: class-deduction-system-backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/class_deduction_system?useUnicode=true&characterEncoding=utf8&serverTimezone=America/New_York
    username: root
    password: 123456whw
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  jackson:
    time-zone: America/New_York
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8084
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/html,text/xml,text/plain,text/css
    min-response-size: 2048

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    enabled: true
  auth:
    session-ttl-hours: 12
    interceptor-enabled: true
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:5174
      - http://localhost:5175
      - http://127.0.0.1:5175
      - http://localhost:3000
      - http://127.0.0.1:3000
      - https://class.jinbesttutoring.com
  notification:
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
      from-address: ${NOTIFICATION_EMAIL_FROM_ADDRESS:}
      from-name: ${NOTIFICATION_EMAIL_FROM_NAME:JIN BEST TUTORING}
      strict-allowlist: ${NOTIFICATION_EMAIL_STRICT_ALLOWLIST:false}
      allowed-recipients:
        - ${NOTIFICATION_EMAIL_ALLOWED_RECIPIENT:}
      max-batch-size: ${NOTIFICATION_EMAIL_MAX_BATCH_SIZE:20}
      max-retries: ${NOTIFICATION_EMAIL_MAX_RETRIES:5}
