server:
  port: 8084
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/class_deduction_system?useUnicode=true&characterEncoding=utf8&serverTimezone=America/New_York
    username: shsat_user
    password: Ethan20190225!
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  mail:
    host: smtp.qq.com
    port: 587
    username: ''
    password: ''
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  jackson:
    time-zone: America/New_York
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    enabled: true
  auth:
    session-ttl-hours: 12
    interceptor-enabled: true
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
  notification:
    email:
      enabled: false
      from-address: ''
      from-name: 'JIN BEST TUTORING'
      strict-allowlist: false
      allowed-recipients: []
      max-batch-size: 20
      max-retries: 5
